configuration:
  syslog_port:
    name: "UDP Порт Syslog"
    description: "Порт UDP, на котором сервер ожидает входящие пакеты логов от роутеров (по умолчанию: 514)."
  retention_days:
    name: "Срок хранения логов (дней)"
    description: "Количество дней хранения логов до автоматической очистки (по умолчанию: 14 дней)."
  max_db_size_mb:
    name: "Максимальный размер базы данных (МБ)"
    description: "Предельный размер файла базы SQLite. При превышении лимита старые логи автоматически удаляются (по умолчанию: 500 МБ)."
  rate_limit_per_sec:
    name: "Лимит сообщений в секунду"
    description: "Максимальное количество сообщений в секунду с одного IP-адреса для защиты от сетевого флуда (по умолчанию: 100)."
  allowed_hosts:
    name: "Разрешенные IP-адреса или подсети"
    description: "Список доверенных IP-адресов роутеров или подсетей CIDR (например: 192.168.1.1, 192.168.1.0/24). Если список пуст, принимаются сообщения от всех устройств."
