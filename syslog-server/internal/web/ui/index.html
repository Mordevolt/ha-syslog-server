<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syslog Server</title>
  <style>
    :root {
      --bg-primary: #111827;
      --bg-secondary: #1f2937;
      --bg-card: #182234;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border-color: #374151;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --badge-emerg: #dc2626;
      --badge-err: #ef4444;
      --badge-warn: #f59e0b;
      --badge-info: #0ea5e9;
      --badge-debug: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    header { background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; color: #fff; }
    .brand svg { width: 26px; height: 26px; fill: var(--accent); }
    .version-tag { font-size: 0.75rem; background: #374151; padding: 2px 6px; border-radius: 4px; color: #9ca3af; }

    /* Top Stats */
    .stats-container { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .stat-chip { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; display: flex; gap: 6px; }
    .stat-label { color: var(--text-muted); }
    .stat-val { font-weight: 600; color: #38bdf8; }

    /* Top Actions */
    .top-actions { display: flex; gap: 8px; align-items: center; }
    button { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
    button:hover { background: #2d3748; border-color: #4b5563; }
    button.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn-primary:hover { background: var(--accent-hover); }
    button.btn-live { border-color: #10b981; color: #34d399; }
    button.btn-paused { border-color: #f59e0b; color: #fbbf24; }

    /* Filter Bar */
    .filter-bar { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 10px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; position: relative; }
    .search-box input { width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; padding: 6px 12px 6px 32px; font-size: 0.85rem; outline: none; }
    .search-box input:focus { border-color: var(--accent); }
    .search-box svg { position: absolute; left: 10px; top: 8px; width: 14px; height: 14px; fill: var(--text-muted); }
    select { background: var(--bg-secondary); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; outline: none; }
    select:focus { border-color: var(--accent); }

    /* Main Log Container */
    main { flex: 1; overflow-y: auto; padding: 0; background: #0b0f19; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 0.82rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { position: sticky; top: 0; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 8px 12px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; z-index: 10; }
    td { padding: 6px 12px; border-bottom: 1px solid #1f2937; vertical-align: top; white-space: nowrap; }
    tr:hover { background-color: #172033; }
    td.msg-cell { white-space: pre-wrap; word-break: break-all; min-width: 300px; color: #e2e8f0; }

    /* Severity Badges */
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .badge-0, .badge-1, .badge-2, .badge-3 { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-4 { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-5, .badge-6 { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); }
    .badge-7 { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.4); }

    .host-tag { color: #818cf8; font-weight: 500; }
    .process-tag { color: #34d399; }
    .time-cell { color: #94a3b8; }

    /* Footer Pagination */
    footer { background-color: var(--bg-secondary); border-top: 1px solid var(--border-color); padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    .pagination-btn { padding: 4px 8px; font-size: 0.75rem; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background-color: #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
      <span>Syslog Server</span>
      <span class="version-tag">v1.0.0</span>
    </div>

    <div class="stats-container">
      <div class="stat-chip">
        <span class="stat-label">Всего записей:</span>
        <span class="stat-val" id="stat-total">0</span>
      </div>
      <div class="stat-chip">
        <span class="stat-label">Размер БД:</span>
        <span class="stat-val" id="stat-size">0 MB</span>
      </div>
      <div class="stat-chip">
        <span class="stat-label">Хранение:</span>
        <span class="stat-val" id="stat-retention">14 дн.</span>
      </div>
    </div>

    <div class="top-actions">
      <button id="btn-toggle-stream" class="btn-live">
        <span class="live-dot" id="live-indicator"></span>
        <span id="stream-text">Live: Вкл</span>
      </button>
      <button id="btn-clear">Очистить экран</button>
      <button class="btn-primary" id="btn-export-csv">📥 Скачать CSV</button>
      <button class="btn-primary" id="btn-export-raw">📄 Скачать RAW</button>
    </div>
  </header>

  <div class="filter-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search-input" placeholder="Поиск по тексту, тегу или процессу...">
    </div>

    <select id="select-host">
      <option value="">Все роутеры (IP)</option>
    </select>

    <select id="select-severity">
      <option value="">Все уровни</option>
      <option value="3">Ошибки (Error + Crit)</option>
      <option value="4">Предупреждения (Warning +)</option>
      <option value="6">Информационные (Info +)</option>
      <option value="7">Отладка (Debug)</option>
    </select>

    <button id="btn-refresh">🔄 Обновить</button>
  </div>

  <main id="log-container">
    <table>
      <thead>
        <tr>
          <th style="width: 160px;">Время</th>
          <th style="width: 90px;">Уровень</th>
          <th style="width: 140px;">Роутер / IP</th>
          <th style="width: 130px;">Процесс</th>
          <th>Сообщение</th>
        </tr>
      </thead>
      <tbody id="logs-tbody">
        <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px;">Загрузка логов...</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <div id="footer-count">Показано 0 записей</div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="pagination-btn" id="btn-prev" disabled>◀ Назад</button>
      <span id="page-info" style="color: var(--text-muted); font-size: 0.75rem;">Стр. 1</span>
      <button class="pagination-btn" id="btn-next">Вперед ▶</button>
    </div>
  </footer>

  <script>
    const state = {
      isStreaming: true,
      eventSource: null,
      offset: 0,
      limit: 100,
      total: 0,
      search: '',
      host: '',
      severity: '',
      buffer: []
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour12: false });
    }

    function createLogRow(entry) {
      const tr = document.createElement('tr');
      const sevClass = 'badge-' + (entry.severity !== undefined ? entry.severity : 6);
      tr.innerHTML = `
        <td class="time-cell">${escapeHtml(formatTime(entry.timestamp))}</td>
        <td><span class="badge ${sevClass}">${escapeHtml(entry.severity_name || 'info')}</span></td>
        <td class="host-tag">${escapeHtml(entry.hostname || entry.source_ip)}</td>
        <td class="process-tag">${escapeHtml(entry.tag || '-')}</td>
        <td class="msg-cell">${escapeHtml(entry.message)}</td>
      `;
      return tr;
    }

    async function loadLogs() {
      const params = new URLSearchParams({
        limit: state.limit,
        offset: state.offset
      });
      if (state.search) params.set('search', state.search);
      if (state.host) params.set('ip', state.host);
      if (state.severity) params.set('severity', state.severity);

      try {
        const res = await fetch('api/logs?' + params.toString());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        state.total = data.total || 0;
        const tbody = document.getElementById('logs-tbody');
        tbody.innerHTML = '';

        if (!data.entries || data.entries.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px;">Нет логов, удовлетворяющих фильтру</td></tr>';
        } else {
          for (const e of data.entries) {
            tbody.appendChild(createLogRow(e));
          }
        }
        updatePagination();
      } catch (err) {
        console.error('Failed to load logs:', err);
      }
    }

    async function loadStats() {
      try {
        const res = await fetch('api/stats');
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('stat-total').textContent = (data.total_logs || 0).toLocaleString();
        document.getElementById('stat-size').textContent = (data.db_size_mb || 0).toFixed(1) + ' MB';
        document.getElementById('stat-retention').textContent = (data.retention_days || 14) + ' дн.';
      } catch (e) {}
    }

    async function loadHosts() {
      try {
        const res = await fetch('api/hosts');
        if (!res.ok) return;
        const hosts = await res.json();
        const sel = document.getElementById('select-host');
        const current = sel.value;
        sel.innerHTML = '<option value="">Все роутеры (IP)</option>';
        if (hosts) {
          for (const h of hosts) {
            const opt = document.createElement('option');
            opt.value = h;
            opt.textContent = h;
            if (h === current) opt.selected = true;
            sel.appendChild(opt);
          }
        }
      } catch (e) {}
    }

    function initSSE() {
      if (state.eventSource) {
        state.eventSource.close();
      }

      state.eventSource = new EventSource('api/stream');

      state.eventSource.onmessage = (event) => {
        if (!state.isStreaming) return;
        try {
          const entry = JSON.parse(event.data);
          
          // Check client filters
          if (state.search && !entry.message.toLowerCase().includes(state.search.toLowerCase()) && !entry.tag.toLowerCase().includes(state.search.toLowerCase())) return;
          if (state.host && entry.source_ip !== state.host) return;
          if (state.severity && entry.severity > parseInt(state.severity, 10)) return;

          const tbody = document.getElementById('logs-tbody');
          const firstRow = tbody.firstElementChild;
          const newRow = createLogRow(entry);

          if (firstRow && firstRow.children.length === 1) {
            tbody.innerHTML = '';
          }
          tbody.insertBefore(newRow, tbody.firstChild);

          // Keep table size under limit while live streaming
          if (tbody.children.length > state.limit) {
            tbody.removeChild(tbody.lastChild);
          }

          state.total++;
          document.getElementById('stat-total').textContent = state.total.toLocaleString();
        } catch (e) {
          console.error('SSE parse error:', e);
        }
      };

      state.eventSource.onerror = () => {
        console.warn('SSE connection interrupted, retrying...');
      };
    }

    function updatePagination() {
      const page = Math.floor(state.offset / state.limit) + 1;
      const totalPages = Math.ceil(state.total / state.limit) || 1;
      document.getElementById('page-info').textContent = `Стр. ${page} из ${totalPages}`;
      document.getElementById('footer-count').textContent = `Показано ${document.getElementById('logs-tbody').children.length} из ${state.total} записей`;
      document.getElementById('btn-prev').disabled = state.offset <= 0;
      document.getElementById('btn-next').disabled = state.offset + state.limit >= state.total;
    }

    // Event Listeners
    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        state.search = e.target.value.trim();
        state.offset = 0;
        loadLogs();
      }, 300);
    });

    document.getElementById('select-host').addEventListener('change', (e) => {
      state.host = e.target.value;
      state.offset = 0;
      loadLogs();
    });

    document.getElementById('select-severity').addEventListener('change', (e) => {
      state.severity = e.target.value;
      state.offset = 0;
      loadLogs();
    });

    document.getElementById('btn-refresh').addEventListener('click', () => {
      loadLogs();
      loadStats();
      loadHosts();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      document.getElementById('logs-tbody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px;">Экран очищен</td></tr>';
    });

    document.getElementById('btn-toggle-stream').addEventListener('click', () => {
      state.isStreaming = !state.isStreaming;
      const btn = document.getElementById('btn-toggle-stream');
      const dot = document.getElementById('live-indicator');
      const txt = document.getElementById('stream-text');

      if (state.isStreaming) {
        btn.className = 'btn-live';
        dot.style.display = 'inline-block';
        txt.textContent = 'Live: Вкл';
      } else {
        btn.className = 'btn-paused';
        dot.style.display = 'none';
        txt.textContent = 'Live: Пауза';
      }
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (state.offset > 0) {
        state.offset -= state.limit;
        loadLogs();
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (state.offset + state.limit < state.total) {
        state.offset += state.limit;
        loadLogs();
      }
    });

    document.getElementById('btn-export-csv').addEventListener('click', () => {
      const params = new URLSearchParams({ format: 'csv' });
      if (state.search) params.set('search', state.search);
      if (state.host) params.set('ip', state.host);
      if (state.severity) params.set('severity', state.severity);
      window.location.href = 'api/export?' + params.toString();
    });

    document.getElementById('btn-export-raw').addEventListener('click', () => {
      const params = new URLSearchParams({ format: 'raw' });
      if (state.search) params.set('search', state.search);
      if (state.host) params.set('ip', state.host);
      if (state.severity) params.set('severity', state.severity);
      window.location.href = 'api/export?' + params.toString();
    });

    // Startup
    loadLogs();
    loadStats();
    loadHosts();
    initSSE();
    setInterval(loadStats, 10000);
    setInterval(loadHosts, 30000);
  </script>
</body>
</html>
