name: "Syslog Server"
slug: "syslog_server"
version: "1.0.2"
description: "Ultra-lightweight Syslog Server with Web UI (Ingress), Auto-Retention, and Security Controls"
url: "https://github.com/Mordevolt/ha-syslog-server"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:math-log"
panel_title: "Syslog"
ports:
  514/udp: 514
ports_description:
  514/udp: "Syslog UDP Ingestion Port"
schema:
  syslog_port: "int(1,65535)"
  retention_days: "int(1,365)"
  max_db_size_mb: "int(50,10000)"
  rate_limit_per_sec: "int(10,5000)"
  allowed_hosts:
    - str
options:
  syslog_port: 514
  retention_days: 14
  max_db_size_mb: 500
  rate_limit_per_sec: 100
  allowed_hosts: []
